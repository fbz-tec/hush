services:
  postgresql:
    image: postgres:18.6
    container_name: postgresql
    environment:
      - POSTGRES_USER=hush
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - POSTGRES_DB=hushdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hush -d hushdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: