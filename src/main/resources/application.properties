spring.application.name=hush

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:./local/keystore-local.p12
server.ssl.key-store-password=${HUSH_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=hush-local

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hushdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:hush}
spring.datasource.password=${DB_PASSWORD}
# a concurrent reveal on the same row must fail fast instead of piling up on Hikari connections
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '2s'

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Jackson reads the whole body before @Size runs: cap it so a huge JSON cannot fill the heap.
# secretText is at most 10 000 chars; a fully \u-escaped one is ~60 000 bytes
spring.jackson.factory.constraints.read.max-string-length=20000
spring.jackson.factory.constraints.read.max-document-length=100000

hush.expiration.delay=7d
hush.encrypt.key=${HUSH_ENCRYPT_KEY}

# per client IP and minute; failures = unknown/expired/revealed lookups tolerated per 10 minutes
hush.ratelimit.create=10
hush.ratelimit.meta=60
hush.ratelimit.reveal=20
hush.ratelimit.failures=10

# the client IP comes from the TCP connection only (no proxy): do NOT set server.forward-headers-strategy
logging.file.name=logs/hush.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{ip:--}] %logger{20} - %msg%n

spring.docker.compose.stop.command=down
