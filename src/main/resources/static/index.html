<!doctype html>
<html lang="en" class="i18n-pending">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- the secret id is in the URL: never leak it to other sites -->
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>Hush</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='20' y='20' width='60' height='60' fill='%23c8001e'/></svg>">
    <link rel="stylesheet" href="/app.css">
    <script src="/i18n.js" defer></script>
    <script src="/app.js" defer></script>
</head>
<body>
<header class="topbar">
    <a href="/" class="brand" data-link>
        <span class="brand-mark" aria-hidden="true"></span> Hush
    </a>
    <div class="topbar-end">
        <span class="tagline" data-i18n="header.tagline"></span>
        <!-- language names are written in their own language, so they are not translated -->
        <div class="lang-switch">
            <button type="button" class="lang-btn" data-lang="fr" lang="fr" aria-label="Français" title="Français" aria-pressed="false">
                <svg viewBox="0 0 3 2" aria-hidden="true" focusable="false">
                    <rect width="1" height="2" fill="#0055a4"/>
                    <rect x="1" width="1" height="2" fill="#ffffff"/>
                    <rect x="2" width="1" height="2" fill="#ef4135"/>
                </svg>
            </button>
            <button type="button" class="lang-btn" data-lang="en" lang="en" aria-label="English" title="English" aria-pressed="false">
                <svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
                    <clipPath id="gb-saltire"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
                    <rect width="60" height="30" fill="#012169"/>
                    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6"/>
                    <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#gb-saltire)" stroke="#c8102e" stroke-width="4"/>
                    <path d="M30,0 v30 M0,15 h60" stroke="#ffffff" stroke-width="10"/>
                    <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/>
                </svg>
            </button>
        </div>
    </div>
</header>

<main class="container">
    <div id="banner" class="banner" role="alert" hidden><span id="banner-text"></span><span id="banner-actions"></span></div>

    <!-- 1. Create -->
    <section id="view-create" class="view" hidden>
        <h1 data-i18n="create.title"></h1>
        <p class="lead" data-i18n-html="create.lead"></p>

        <form id="create-form" class="card" novalidate>
            <label for="secret-text" class="label" data-i18n="create.secretLabel"></label>
            <textarea id="secret-text" name="secretText" rows="7" maxlength="10000"
                      data-i18n-attr="placeholder:create.secretPlaceholder" aria-describedby="secret-meta secretText-error"
                      autofocus></textarea>
            <div id="secret-meta" class="field-meta">
                <span id="secretText-error" class="field-error" aria-live="polite"></span>
                <span id="counter" class="counter"></span>
            </div>

            <label class="check">
                <input id="protect" type="checkbox" aria-controls="passphrase-field">
                <span data-i18n="create.protect"></span>
            </label>
            <div id="passphrase-field" class="field" hidden>
                <label for="passphrase" class="label" data-i18n="common.passphrase"></label>
                <!-- no maxlength: it counts characters and would silently cut the passphrase; the server checks bytes -->
                <input id="passphrase" type="password" autocomplete="new-password"
                       aria-describedby="passphrase-hint passphrase-error">
                <span id="passphrase-hint" class="field-help muted" data-i18n="create.passphraseHint"></span>
                <span id="passphrase-error" class="field-error" aria-live="polite"></span>
            </div>

            <div class="row">
                <div class="field">
                    <label for="ttl" class="label" data-i18n="create.ttlLabel"></label>
                    <select id="ttl" name="ttlSeconds" aria-describedby="ttlSeconds-error">
                        <option value="60" data-i18n="ttl.60"></option>
                        <option value="300" data-i18n="ttl.300"></option>
                        <option value="1800" data-i18n="ttl.1800"></option>
                        <option value="3600" data-i18n="ttl.3600"></option>
                        <option value="14400" data-i18n="ttl.14400"></option>
                        <option value="43200" data-i18n="ttl.43200"></option>
                        <option value="86400" data-i18n="ttl.86400"></option>
                        <option value="259200" data-i18n="ttl.259200"></option>
                        <option value="604800" data-i18n="ttl.604800" selected></option>
                    </select>
                    <span id="ttlSeconds-error" class="field-error" aria-live="polite"></span>
                </div>
                <button id="create-btn" type="submit" class="btn btn-primary" data-i18n="create.submit" disabled></button>
            </div>
        </form>

        <ul class="features">
            <li data-i18n="create.features.encrypted"></li>
            <li data-i18n="create.features.burn"></li>
            <li data-i18n="create.features.expiry"></li>
        </ul>
    </section>

    <!-- 2. Link created -->
    <section id="view-created" class="view" hidden>
        <div class="card">
            <div class="status status-success"><span aria-hidden="true">✓</span> <span data-i18n="created.status"></span></div>
            <p data-i18n-html="created.instructions"></p>
            <div class="copy-row">
                <input id="share-link" type="text" readonly data-i18n-attr="aria-label:created.linkLabel">
                <button type="button" class="btn btn-primary" data-copy="share-link" data-i18n="common.copy"></button>
            </div>
            <p class="muted"><span data-i18n="created.expiresOn"></span> <time id="expires-at" data-date></time></p>
            <p id="created-protected" class="muted" data-i18n="created.protected" hidden></p>
            <div class="notice" data-i18n="created.notice"></div>
            <a href="/" class="btn btn-secondary" data-link data-i18n="created.another"></a>
        </div>
    </section>

    <!-- 3. Open a secret -->
    <section id="view-open" class="view" hidden>
        <div class="card">
            <div id="open-loading" class="loading" hidden><span class="spinner" aria-hidden="true"></span> <span data-i18n="common.loading"></span></div>

            <div id="open-ready" hidden>
                <div class="status status-info"><span aria-hidden="true">✉</span> <span data-i18n="open.status"></span></div>
                <p data-i18n-html="open.warning"></p>
                <p class="muted"><span data-i18n="open.availableUntil"></span> <time id="open-expires-at" data-date></time></p>
                <form id="reveal-form" novalidate>
                    <div id="reveal-passphrase-field" class="field" hidden>
                        <p data-i18n="open.protectedNotice"></p>
                        <label for="reveal-passphrase" class="label" data-i18n="common.passphrase"></label>
                        <!-- a saved password filled in here would burn one of the 5 attempts -->
                        <input id="reveal-passphrase" type="password" autocomplete="one-time-code"
                               data-1p-ignore data-lpignore="true" data-bwignore
                               aria-describedby="reveal-passphrase-error">
                        <span id="reveal-passphrase-error" class="field-error" aria-live="polite"></span>
                    </div>
                    <button id="reveal-btn" type="submit" class="btn btn-primary" data-i18n="open.reveal"></button>
                </form>
            </div>

            <div id="open-revealed" hidden>
                <div class="status status-success"><span aria-hidden="true">✓</span> <span data-i18n="open.revealedStatus"></span></div>
                <pre id="secret-content" class="secret" tabindex="0"></pre>
                <div class="actions">
                    <button type="button" class="btn btn-primary" data-copy="secret-content" data-i18n="common.copy"></button>
                </div>
                <div class="notice notice-warn" data-i18n="open.destroyedNotice"></div>
            </div>

            <div id="open-error" hidden>
                <div class="state-icon" id="error-icon" aria-hidden="true"></div>
                <h2 id="error-title"></h2>
                <p id="error-text" class="muted"></p>
                <a href="/" class="btn btn-secondary" data-link data-i18n="open.createSecret"></a>
            </div>
        </div>
    </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
